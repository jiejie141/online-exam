spring:
  application:
    name: online-exam

  # 默认跑 dev。生产用 SPRING_PROFILES_ACTIVE=prod 覆盖。
  #
  # 为什么要有默认值：没有它时，忘记设环境变量的部署会以「没有任何 profile」的状态启动，
  # 于是 application-dev.yml / application-prod.yml 都不生效，配置全落在下面这份公共文件里 ——
  # 那种「看起来启动了、其实跑的是另一套配置」最难排查。
  # 给个默认 dev 至少让本地和 CI 的行为是确定的、写下来的。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 版本化迁移。
  #
  # baseline-on-migrate: true 是给**已经存在的库**用的。
  # 没有它时，一个已经有 6 张表、但没有 flyway_schema_history 的库，
  # Flyway 会直接报「found non-empty schema without schema history table」并拒绝启动 ——
  # 而那正是本项目所有现有环境的形态（它们都是按 schema.sql 建的）。
  # 打开之后：非空库自动记一条 baseline（默认版本 1），从 V2 开始往上迁。
  #
  # baseline-version: 1 而不是默认值，是为了和 V1__baseline.sql 对齐 ——
  # V1 的内容就是那 6 张表，已存在的库等于「已经处于 V1」，标成 1 才准确。
  # 如果标成 0，Flyway 会尝试重跑 V1：IF NOT EXISTS 让它无害，
  # 但历史表里会留下一条「我建过表」的假记录，以后排查会被它误导。
  #
  # validate-on-migrate 保持默认的 true —— 已应用的迁移文件被改过就拒绝启动。
  # 这是迁移工具最主要的价值：让「这份 DDL 到底跑没跑过」不再靠人记。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    default-property-inclusion: non_null

  # 优雅停机：收到 SIGTERM 后先摘掉流量、等在途请求做完，再退出。
  #
  # 原来用的是默认的 immediate —— 容器滚动更新时，一个正在交卷的请求会被直接掐断，
  # 学生看到的是「提交失败」，而服务端其实连 SQL 都没跑完。
  # 考试系统里「交卷」是唯一不可重来的操作，这个窗口必须留出来。
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8081
  shutdown: graceful

mybatis-plus:
  configuration:
    # 统计查询的别名一律写 snake_case（avg_score 等），靠它映射回驼峰字段
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

exam:
  jwt:
    # 必须由环境变量 EXAM_JWT_SECRET 注入，**故意不给默认值**。
    #
    # 原来这里写着一个能直接用的默认密钥（online-exam-dev-secret-...），
    # 那等于把签名密钥连同代码一起提交进了版本库：任何读过这个仓库的人
    # 都能自己签一个 role=teacher 的令牌，直接改成绩。
    # 原来的注释写着「生产要改」，但没有任何东西**强制**改 —— 那就迟早不会改。
    # 现在留空 + JwtUtil 启动即校验，不设就起不来（fail-closed）。
    secret: "${EXAM_JWT_SECRET:}"
    ttl-minutes: ${EXAM_JWT_TTL_MINUTES:120}
  grading:
    # true = 交卷后丢 MQ 异步判分；false = 同步判分（本地没起 RabbitMQ 时用这个）
    async: true
    # 漏判扫描间隔。判分失败被消费者吞掉（不吞会被 Broker 无限重投），
    # 所以需要一个任务定期把「交过卷但没分」的数量做成指标，否则失败是静默的。
    # 30 秒是权衡：够快能及时发现，又不至于频繁打库（走 idx_record_deadline 前缀 status）。
    sweep-delay-ms: ${EXAM_GRADING_SWEEP_DELAY_MS:30000}
  cache:
    paper-ttl-seconds: 600   # L2（Redis）卷面缓存 10 分钟，实际过期时刻带 ±20% 抖动
    null-ttl-seconds: 60     # 空卷面（哨兵）缓存 1 分钟就够，防止穿透
    jitter-ratio: 0.2
    # L1（本地 Caffeine）的存活时间。必须显著短于 L2 的 600 秒：
    # 卷面本身发布后不变，但「另一个实例发布了新卷」这件事只能靠 L2 的 evict 传播，
    # 本实例的 L1 收不到通知，只能等它自己过期。30 秒是「旧卷最多被看到 30 秒」
    # 这个窗口的上界。如果将来卷面变成可编辑的，这里必须先改成广播失效。
    local-ttl-seconds: 30
    # 本地缓存条目上限。没有上界的本地缓存等于内存泄漏 ——
    # 考试 id 会一直增长，迟早把堆吃光。
    local-max-size: 200
  auto-submit:
    # 定时任务每 30 秒扫一次超时未交卷的答卷
    fixed-delay-ms: 30000
    batch-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
