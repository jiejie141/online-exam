<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    favicon 用内联 SVG，不单独放一个 .ico 文件。两个理由：
    1. 没有 /favicon.ico 时浏览器会自己发一次请求并拿到 404 —— 控制台里
       常年挂着一条红色错误，真出问题时反而要多花一步排除它。
    2. 一个纯色方块加个对勾用不着二进制图标文件，data URI 省掉一次请求，
       也省掉「这个 ico 是谁生成的、以后怎么改」这个维护问题。
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23409eff'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <title>在线考试系统</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
