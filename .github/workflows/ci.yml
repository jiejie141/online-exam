# ===========================================================================
# CI：每次 push / PR 自动验证
#
# 分四个 job，故意拆开 —— 失败时能一眼看出是哪一类问题：
#   unit    : mvn test（178 条单元测试，纯内存，不依赖任何中间件）
#   frontend: 前端 vitest 单测 + vite 构建（Node，不装 JDK / 不连数据库）
#   e2e     : 起真 MySQL / Redis / RabbitMQ，跑 scripts/e2e.sh 与 e2e_check.py
#   docker  : 镜像能不能构建出来
#
# frontend 单独一个 job 的理由：它一条 Java 代码都不碰，塞进 unit 只会让
# java 17/21 两个 matrix 各白跑一遍 npm；而它失败的原因（组件报错、
# 构建产物路径不对）和 unit 失败的原因（SQL、事务、状态机）完全是两类。
#
# 为什么必须拆：这个项目的 SQL 用了 MySQL 专有语法（JSON 列、
# INSERT ... AS new ON DUPLICATE KEY UPDATE），README 第七节写明了
# 「不引入 H2」，因为 H2 跑出来的通过是假的。所以单元测试和
# 「SQL 到底对不对」是两件不同的事，前者绿了不代表后者绿。
# ===========================================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧运行没有价值，直接取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只读仓库内容，不申请任何写权限
permissions:
  contents: read

# 注意：这里**不**定义全局 EXAM_JWT_SECRET。
#
# 它看起来更省事，但会让 docker job 里那条「容器缺密钥时必须拒绝启动」的
# 检查失去意义 —— 全局 env 会把它注入进去，测试就永远绿，
# 而真正的 fail-closed 契约也就没人验了。
# 需要它的 job（unit）在自己的 steps 里显式设置。

jobs:
  # ---------------------------------------------------------------------
  # 前端单测 + 构建
  #
  # 为什么要有这个 job：后端 178 条单测全绿，不代表页面上那个按钮点下去
  # 不会炸。倒计时、多选答案的拼接、401 之后往哪跳 —— 这些逻辑都在 JS 里，
  # 之前只靠人点。
  #
  # 为什么不把它并进 unit：unit 跑的是 java 17 / 21 的 matrix，前端不关心
  # JDK 版本，并进去等于同一份 vitest 白跑两遍；而且失败信号会混在一起。
  # ---------------------------------------------------------------------
  frontend:
    name: 前端单测 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      # vitest 的输出在失败时会把每个用例的断言差异打出来，
      # 所以这里不需要像 surefire 那样额外抬注解。
      - name: 单元测试
        run: npm test

      # 测过还要能构建才算数：按需引入改的是打包行为，
      # 测试跑的是源码模块，两者不是同一件事。
      - name: 构建
        run: npm run build

      # 产物要落到后端的静态资源目录，否则镜像里是空的。
      # outDir 是 ../src/main/resources/static（相对 web/）。
      - name: 确认产物落到了后端要读的目录
        run: |
          set -e
          test -f ../src/main/resources/static/index.html || {
            echo '::error::构建产物没落到 src/main/resources/static —— outDir 配错了？'
            exit 1
          }
          grep -q '/assets/' ../src/main/resources/static/index.html || {
            echo '::error::index.html 里没有引用任何 /assets/ 资源'
            exit 1
          }
          echo "::notice::构建产物 $(ls ../src/main/resources/static/assets | wc -l) 个文件"

  unit:
    name: 单元测试 (java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # 把「这个 job 到底测的是哪套栈」打出来。
      #
      # pom 里 spring-boot 是固定版本 3.3.4，但 mybatis-plus 等依赖用的是
      # 属性变量，且 Maven 会按最近的可用版本解析。打印实际解析结果，
      # 比事后猜「为什么只有这个 job 红」便宜得多。
      - name: 打印实际依赖版本
        run: mvn -B -q dependency:list -DincludeScope=test -DoutputFile=/tmp/deps.txt && head -40 /tmp/deps.txt || true

      - name: mvn test
        # 这 178 条都是纯单元测试（Mockito 打桩），**不加载 Spring 上下文**，
        # 因此严格来说不需要密钥。显式给一个是为了：
        #   1. 万一以后有人加了 @SpringBootTest，不会因为「CI 环境没设变量」而红；
        #   2. 让「密钥从哪来」在 workflow 里是可见的，而不是隐含的。
        env:
          EXAM_JWT_SECRET: ci-only-secret-please-do-not-reuse-0123456789abcdef
        run: mvn -B test

      # surefire 的报告是 XML。失败时把它抬进 GitHub 注解，
      # 这样不用下拉日志就能看到是哪条用例、断言了什么。
      - name: 失败时输出用例级摘要
        if: failure()
        run: |
          grep -l '<failure\|<error' target/surefire-reports/*.xml 2>/dev/null | while read f; do
            echo "::error file=$f::$(basename "$f") 有用例失败"
          done
          find target/surefire-reports -name '*.txt' -exec tail -30 {} \; 2>/dev/null || true

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-java-${{ matrix.java-version }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  e2e:
    name: 端到端（真 MySQL / Redis / RabbitMQ）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 Python 依赖（e2e_check.py 只用标准库，这步是保险）
        run: python -m pip install --upgrade pip

      # 先把依赖和解压好的插件预热一遍。
      #
      # 为什么需要：e2e.sh 里等应用启动只给 120 秒（60 次 x 2 秒），
      # 本地这个时间绰绰有余，因为 ~/.m2 早就满了。CI 上是从零开始，
      # 而 spring-boot:run 要走 spring-boot-maven-plugin 那条路径，
      # 它需要的插件和依赖跟 `mvn test` 不是同一套 ——
      # 上面 unit job 下的是 test 那一套，缓存按 pom.xml 哈希共享，
      # 但覆盖不到 run 需要的全部东西。
      #
      # 这一步不改变 e2e.sh 的行为，只是让它不必把时间花在下载上。
      # 失败不影响后续（真下不动的话，e2e.sh 自己会报出来）。
      - name: 预热 Maven 依赖（让 e2e.sh 的 120 秒等待留给启动，而不是下载）
        run: mvn -B -q dependency:go-offline || true

      # e2e.sh 自己会 docker compose up -d 并等 MySQL 就绪，
      # 所以这里不重复声明 services —— 保持「本地怎么跑，CI 就怎么跑」。
      - name: 跑端到端（含判分延迟实测）
        # 显式声明密钥，和 unit job 保持一致。
        # e2e.sh 内部也有一个默认值兜底，这里再写一遍是为了：
        # 把『密钥从哪来』放进 workflow 里可见（和 unit job 同样的理由），
        # 而不是依赖脚本内部的隐式默认。
        env:
          EXAM_JWT_SECRET: ci-only-secret-please-do-not-reuse-0123456789abcdef
        run: |
          # 这个 job 失败时，匿名能拿到的只有 annotation（job 日志下载要认证）。
          # 而 annotation 有条数上限（约 10 条），**超出的会被静默丢弃** ——
          # 我一开始逐行发 notice，40 行只收到 10 行，看起来像日志是空的。
          #
          # 所以这里一共只发 3 条：退出码、进度序列（压成一行）、失败提示。
          set +e
          # 重定向在 bash 启动**之前**由 shell 处理：target/ 不存在时
          # shell 直接拒绝，命令根本不执行，$? 拿到 1 ——
          # e2e.sh 一次都没跑过，而外面看到的只是『退出码 1』。
          # target/ 在 .gitignore 里，checkout 出来没有。
          mkdir -p target
          bash scripts/e2e.sh > target/e2e-run.log 2>&1
          rc=$?
          cat target/e2e-run.log
          steps=$(grep -E '^== |^!!|^MySQL ready|^app ready' target/e2e-run.log 2>/dev/null | tr '\n' ' ' | head -c 700)
          # 成功时必须发 notice 而不是 error。
          # 之前这里无条件发 ::error，于是全绿的 run 页面上也挂着一条
          # 「1 error」，标题还写着「退出码=0」—— 正是本项目反复踩的那个坑：
          # 仪表在骗人。判据是 rc，不是「有没有输出」。
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=e2e.sh 通过::${steps:-（没有任何进度输出）}"
          else
            echo "::error title=e2e.sh 退出码=${rc}::${steps:-（没有任何进度输出）}"
          fi
          exit $rc

      # 失败时把关键信息**压缩成极少数几行**推出来。
      #
      # 前两版都失败在一个我没预料的地方：GitHub 对每个 job 的 annotation
      # 数量有上限（大约 10 条），而且**超出的会被静默丢弃**。
      # 我一行一条 notice 地推 40 行日志，结果只收到 10 条，
      # 而且顺序是乱的 —— 看起来像『日志是空的』，实际是『发不出去』。
      #
      # 所以这里改成：把每段信息压成**一行**，总共不超过 5 条。
      # 把完整日志传成 artifact。
      #
      # 前面几轮都在试图把关键信息塞进 annotation，但 annotation 有条数上限
      # （约 10 条，超出静默丢弃），而且每条还有长度上限会被截断 ——
      # 我为了看一段堆栈花了四轮。
      # artifact 没有这些问题：几 MB 的日志原样传上去，
      # 谁有仓库读权限谁就能下。要登录，但这是一次性的成本，
      # 而『每轮猜一次』的成本是复利的。
      - name: 上传日志（失败时才有用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            target/e2e-run.log
            target/e2e-app.log
            target/e2e-check.log
          if-no-files-found: ignore
          retention-days: 7

      # 把日志切成几条 annotation 发出来。
      #
      # artifact 要登录才能下（已验证 401），而这里需要的只是
      # 『看一眼就知道哪行错』。日志本身很小（应用是启动即失败，几 KB），
      # 用 base64 绕开换行和特殊字符，切成每段 800 字符，
      # 控制在 annotation 上限之内。
      - name: 服务日志（失败时才有用）
        if: failure()
        run: |
          set +e
          for f in target/e2e-app.log target/e2e-run.log; do
            if [ -s "$f" ]; then
              b64=$(gzip -c "$f" | base64 -w0)
              echo "::error title=$f (gzip+base64, ${#b64} 字符)::$(echo $b64 | cut -c1-1500)"
              if [ ${#b64} -gt 1500 ]; then
                echo "::error title=$f 续::$(echo $b64 | cut -c1501-3000)"
              fi
            else
              echo "::error title=$f::文件为空或不存在"
            fi
          done
          echo '=== 下面是人眼可读的尾部 ==='
          tail -60 target/e2e-app.log 2>/dev/null || true
          echo '=== 应用日志 ==='; tail -60 target/e2e-app.log 2>/dev/null || true
          echo '=== 容器状态 ==='; docker compose ps || true
          echo '=== e2e.sh 输出 ==='; cat target/e2e-run.log 2>/dev/null || true
          echo '=== 校验脚本输出 ==='; cat target/e2e-check.log 2>/dev/null || true
          # 压缩版：一行摘要，保证发得出去
          app_last=$(tail -30 target/e2e-app.log 2>/dev/null | tr '\n' ' ' | head -c 1500)
          echo "::error title=应用日志尾部::${app_last:-（target/e2e-app.log 为空或不存在）}"
          run_last=$(tail -3 target/e2e-run.log 2>/dev/null | tr '\n' ' ' | head -c 900)
          echo "::error title=e2e.sh 输出尾部::${run_last:-（空）}"
          parts=$(docker compose ps --format '{{.Name}}:{{.State}}' 2>/dev/null | tr '\n' ' ')
          echo "::error title=容器状态::${parts:-（取不到）}"

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    # 20 分钟不够。正常情况下这个 job 只要 1 分多钟（#19 是 1m16s），
    # 但它要现拉 node:20-alpine 和 maven:3.9-eclipse-temurin-17 两个基础镜像、
    # 再跑 npm ci 和 dependency:go-offline —— 全是外网下载。
    # #20 就卡在这一步被 20 分钟硬砍，整条 workflow 变成 CANCELLED，
    # 而同时段单测和端到端都过了：看起来像 docker 坏了，实际是网络在排队。
    # 放宽到 30 分钟，让「真慢」和「真坏」能分开。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t online-exam:ci .

      # 只 build 成功不代表镜像里有页面。
      #
      # 前端产物 src/main/resources/static/ 不进 git，是 Dockerfile 里
      # 那个 node 阶段现构建再 COPY 进 maven 阶段的。这条链路任何一环断掉
      # （忘了 COPY、outDir 路径对不上、npm run build 静默没产出），
      # 结果都是：镜像构建成功、容器能起、/actuator/health 也绿，
      # 但浏览器打开是 404 —— 而没有任何一条断言会发现它。
      #
      # 所以这里直接把 jar 从镜像里抠出来，检查里面有没有那个文件。
      # 用 docker create + docker cp 而不是起容器：不需要数据库、
      # 不需要密钥、也不会因为 fail-closed 而提前退出。
      - name: 验证镜像里确实打进了前端页面
        run: |
          set -e
          cid=$(docker create online-exam:ci)
          docker cp "$cid:/app/app.jar" /tmp/app.jar
          docker rm -f "$cid" > /dev/null
          if unzip -l /tmp/app.jar | grep -q 'BOOT-INF/classes/static/index.html'; then
            echo '::notice::镜像内含前端页面（BOOT-INF/classes/static/index.html）'
          else
            echo '::error::镜像里没有 static/index.html —— 前端产物没被打进 jar'
            exit 1
          fi

      # 只 build 不够：镜像里可能缺运行时需要的东西。
      # 这里起一个容器、确认它是**因为缺 EXAM_JWT_SECRET 而拒绝启动**，
      # 以此证明「fail-closed 在容器里也生效」，而不是只有单测里成立。
      - name: 验证 fail-closed 在容器内同样生效
        run: |
          set +e
          # 必须加超时：fail-closed 如果真的失效，容器会**正常启动并一直跑下去**，
          # 于是这条命令永远不返回，整个 job 挂到 20 分钟超时 ——
          # 那时看到的是一片"超时"，而不是"fail-closed 坏了"这句结论。
          # 90 秒够正常启动失败路径走完（单测里它是毫秒级的）。
          out=$(timeout 90 docker run --rm -e SPRING_PROFILES_ACTIVE=ci online-exam:ci 2>&1 | tail -40)
          # 上面是管道，$? 拿到的是 tail 的退出码，不是 docker 的 —— 所以不用它，
          # 直接看输出里有没有那句密钥错误。这也是这里不检查退出码的原因。
          echo "$out"
          if echo "$out" | grep -q 'EXAM_JWT_SECRET'; then
            echo '::notice::容器在缺少密钥时拒绝启动，符合预期'
          else
            echo '::error::容器没有因为缺少 EXAM_JWT_SECRET 而报错 —— fail-closed 失效了'
            exit 1
          fi

