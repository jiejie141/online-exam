# ===========================================================================
# CI：每次 push / PR 自动验证
#
# 分三个 job，故意拆开 —— 失败时能一眼看出是哪一类问题：
#   unit  : mvn test（97 条单元测试，纯内存，不依赖任何中间件）
#   e2e   : 起真 MySQL / Redis / RabbitMQ，跑 scripts/e2e.sh 与 e2e_check.py
#   docker: 镜像能不能构建出来
#
# 为什么必须拆：这个项目的 SQL 用了 MySQL 专有语法（JSON 列、
# INSERT ... AS new ON DUPLICATE KEY UPDATE），README 第七节写明了
# 「不引入 H2」，因为 H2 跑出来的通过是假的。所以单元测试和
# 「SQL 到底对不对」是两件不同的事，前者绿了不代表后者绿。
# ===========================================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧运行没有价值，直接取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只读仓库内容，不申请任何写权限
permissions:
  contents: read

# 注意：这里**不**定义全局 EXAM_JWT_SECRET。
#
# 它看起来更省事，但会让 docker job 里那条「容器缺密钥时必须拒绝启动」的
# 检查失去意义 —— 全局 env 会把它注入进去，测试就永远绿，
# 而真正的 fail-closed 契约也就没人验了。
# 需要它的 job（unit）在自己的 steps 里显式设置。

jobs:
  unit:
    name: 单元测试 (java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # 把「这个 job 到底测的是哪套栈」打出来。
      #
      # pom 里 spring-boot 是固定版本 3.3.4，但 mybatis-plus 等依赖用的是
      # 属性变量，且 Maven 会按最近的可用版本解析。打印实际解析结果，
      # 比事后猜「为什么只有这个 job 红」便宜得多。
      - name: 打印实际依赖版本
        run: mvn -B -q dependency:list -DincludeScope=test -DoutputFile=/tmp/deps.txt && head -40 /tmp/deps.txt || true

      - name: mvn test
        # 这 97 条都是纯单元测试（Mockito 打桩），**不加载 Spring 上下文**，
        # 因此严格来说不需要密钥。显式给一个是为了：
        #   1. 万一以后有人加了 @SpringBootTest，不会因为「CI 环境没设变量」而红；
        #   2. 让「密钥从哪来」在 workflow 里是可见的，而不是隐含的。
        env:
          EXAM_JWT_SECRET: ci-only-secret-please-do-not-reuse-0123456789abcdef
        run: mvn -B test

      # surefire 的报告是 XML。失败时把它抬进 GitHub 注解，
      # 这样不用下拉日志就能看到是哪条用例、断言了什么。
      - name: 失败时输出用例级摘要
        if: failure()
        run: |
          grep -l '<failure\|<error' target/surefire-reports/*.xml 2>/dev/null | while read f; do
            echo "::error file=$f::$(basename "$f") 有用例失败"
          done
          find target/surefire-reports -name '*.txt' -exec tail -30 {} \; 2>/dev/null || true

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-java-${{ matrix.java-version }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  e2e:
    name: 端到端（真 MySQL / Redis / RabbitMQ）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 Python 依赖（e2e_check.py 只用标准库，这步是保险）
        run: python -m pip install --upgrade pip

      # 先把依赖和解压好的插件预热一遍。
      #
      # 为什么需要：e2e.sh 里等应用启动只给 120 秒（60 次 x 2 秒），
      # 本地这个时间绰绰有余，因为 ~/.m2 早就满了。CI 上是从零开始，
      # 而 spring-boot:run 要走 spring-boot-maven-plugin 那条路径，
      # 它需要的插件和依赖跟 `mvn test` 不是同一套 ——
      # 上面 unit job 下的是 test 那一套，缓存按 pom.xml 哈希共享，
      # 但覆盖不到 run 需要的全部东西。
      #
      # 这一步不改变 e2e.sh 的行为，只是让它不必把时间花在下载上。
      # 失败不影响后续（真下不动的话，e2e.sh 自己会报出来）。
      - name: 预热 Maven 依赖（让 e2e.sh 的 120 秒等待留给启动，而不是下载）
        run: mvn -B -q dependency:go-offline || true

      # e2e.sh 自己会 docker compose up -d 并等 MySQL 就绪，
      # 所以这里不重复声明 services —— 保持「本地怎么跑，CI 就怎么跑」。
      - name: 跑端到端（含判分延迟实测）
        run: |
          # 把每一步都发成 annotation 的 notice。
          # 理由：这个 job 失败时，匿名能拿到的只有 annotation 和
          # exit code 1 这一行；job 日志正文要认证才下得动。
          # 所以「挂在哪一步」必须主动推出来，不能指望有人去翻网页。
          #
          # 两个坑，都实际踩到了：
          #
          # 1. GitHub 的 run 默认带 -e。管道那行返回非 0 时，脚本立刻退出，
          #    后面的 PIPESTATUS 和 echo notice 全都不执行 ——
          #    表现是失败时一条 notice 都没有，看起来像这段根本不存在。
          #    改成重定向到文件 + 手动记 rc，就不用管道了。
          #
          # 2. 不用 | while 发 notice：while 跑在子 shell 里，rc 传不回来。
          #    用 for + 命令替换。
          set +e
          # 必须先建 target/：下面这行的重定向**发生在 bash 启动之前**。
          # 目录不存在时，shell 直接拒绝建立重定向，命令根本不执行，
          # $? 得到 1 —— 于是 e2e.sh 一次都没跑过，
          # 而外面看到的只是「退出码 1 + 没有日志文件」，
          # 很容易误判成「脚本内部某一步错了」。
          # 这个目录在仓库里是被 .gitignore 掉的，checkout 出来自然没有。
          mkdir -p target
          bash scripts/e2e.sh > target/e2e-run.log 2>&1
          rc=$?
          cat target/e2e-run.log
          echo "::notice::e2e.sh 退出码 = $rc"
          # while read + 进程替换：grep 的整行（含空格）交给 while，
          # 不用 for $(...)：那样会按空格拆词，一条 '== 1/6 起依赖 =='
          # 会被拆成四条 notice。
          # 先把文件本身的情况报出来：之前这个文件到底是空的、
          # 还是没有匹配行，从外面分不清 —— 而这两种情况指向完全不同的原因。
          echo "::notice::e2e-run.log 行数 = $(wc -l < target/e2e-run.log 2>/dev/null || echo '文件不存在')"
          echo "::notice::e2e-run.log 前 8 行 = $(head -8 target/e2e-run.log 2>/dev/null | tr '\n' ' | ')"
          while IFS= read -r line; do
            echo "::notice::$line"
          done < <(grep -E '^== |^!!|^MySQL ready|^app ready' target/e2e-run.log 2>/dev/null)
          # 应用起不来时，答案在那份日志尾部（e2e.sh 会 tail -40）。
          # 上面那条 grep 只认 '== ' 和 '!!' 开头，恰好漏掉真正有用的部分。
          #
          # 这里不用 grep -q + 行号定位：上一版那么写，结果什么都没推出来，
          # 而『什么都没推出来』和『日志本来就是空的』在外部看起来一样。
          # 直接用 sed 截取，并且**无论有没有内容都推一条说明**，
          # 免得又回到「分不清是没内容还是没执行」。
          if [ -s target/e2e-run.log ]; then
            echo "::notice::最后 40 行日志开始"
            tail -40 target/e2e-run.log | while IFS= read -r line; do
              echo "::notice::$line"
            done
            echo "::notice::最后 40 行日志结束"
          else
            echo "::notice::e2e-run.log 是空的，e2e.sh 没产生任何输出"
          fi
          exit $rc

      - name: 服务日志（失败时才有用）
        if: failure()
        run: |
          echo '=== 应用日志 ==='; tail -80 target/e2e-app.log 2>/dev/null || true
          echo '=== 容器状态 ==='; docker compose ps || true
          echo '=== MySQL 日志 ==='; docker compose logs --tail 40 mysql || true
          echo '=== 校验脚本输出（关键） ==='
          # e2e_check.py 的失败项和 e2e.sh 的 !! 提示都在这里
          grep -E '^\s*(PASS|FAIL|SKIP)|通过 [0-9]+ 项|^!!|^==' target/e2e-check.log 2>/dev/null \
            | tail -40 \
            || echo '(没有 target/e2e-check.log)'
          echo '=== 校验脚本输出（关键） ==='
          grep -E 'PASS|FAIL|SKIP|通过 [0-9]+ 项' target/e2e-check.log 2>/dev/null | tail -30 || echo '(无 e2e-check.log)'
          summary=$(grep -E '^\s*FAIL|通过 [0-9]+ 项' target/e2e-check.log 2>/dev/null | tail -12 | tr '\n' ' ')
          if [ -n "$summary" ]; then
            echo "::error title=e2e 校验失败::$summary"
          else
            echo "::error title=e2e 失败::e2e_check.py 没产生输出，失败发生在更早的步骤（见上面的进度 notice）"
          fi

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t online-exam:ci .

      # 只 build 不够：镜像里可能缺运行时需要的东西。
      # 这里起一个容器、确认它是**因为缺 EXAM_JWT_SECRET 而拒绝启动**，
      # 以此证明「fail-closed 在容器里也生效」，而不是只有单测里成立。
      - name: 验证 fail-closed 在容器内同样生效
        run: |
          set +e
          # 必须加超时：fail-closed 如果真的失效，容器会**正常启动并一直跑下去**，
          # 于是这条命令永远不返回，整个 job 挂到 20 分钟超时 ——
          # 那时看到的是一片"超时"，而不是"fail-closed 坏了"这句结论。
          # 90 秒够正常启动失败路径走完（单测里它是毫秒级的）。
          out=$(timeout 90 docker run --rm -e SPRING_PROFILES_ACTIVE=ci online-exam:ci 2>&1 | tail -40)
          # 上面是管道，$? 拿到的是 tail 的退出码，不是 docker 的 —— 所以不用它，
          # 直接看输出里有没有那句密钥错误。这也是这里不检查退出码的原因。
          echo "$out"
          if echo "$out" | grep -q 'EXAM_JWT_SECRET'; then
            echo '::notice::容器在缺少密钥时拒绝启动，符合预期'
          else
            echo '::error::容器没有因为缺少 EXAM_JWT_SECRET 而报错 —— fail-closed 失效了'
            exit 1
          fi

